name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studydb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studydb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: studydb
      DB_USER: app_user
      DB_PASSWORD: ci-app-password
      DB_SSLMODE: disable
      APP_SECRET_KEY: ci-only-session-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r app/requirements.txt

      - name: Install linters
        run: |
          python -m pip install --quiet ruff==0.17.4
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck

      - name: Apply schema and create app_user
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d studydb -v ON_ERROR_STOP=1 \
            -f infra/setup/schema.sql
          psql -h 127.0.0.1 -U postgres -d studydb -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_user LOGIN PASSWORD 'ci-app-password';
          GRANT CONNECT ON DATABASE studydb TO app_user;
          GRANT USAGE ON SCHEMA public TO app_user;
          GRANT SELECT, INSERT, UPDATE, DELETE ON users, tasks TO app_user;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_user;
          SQL
          is_super=$(psql -h 127.0.0.1 -U postgres -d studydb -tAc \
            "SELECT rolsuper FROM pg_roles WHERE rolname = 'app_user'")
          test "$is_super" = "f"

      - name: Syntax checks
        run: |
          set -euo pipefail
          python -m py_compile app/app.py .github/scripts/ci-smoke.py
          node --check app/app.js
          git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n

      - name: Lint
        run: |
          set -euo pipefail
          ruff check app .github/scripts
          git ls-files -z '*.sh' | xargs -0 -r shellcheck -x

      - name: Smoke test (Flask test client)
        run: python .github/scripts/ci-smoke.py

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "$base/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o /tmp/actionlint-checksums.txt \
            "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          expected="$(awk -v f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            '$2 == f {print $1}' /tmp/actionlint-checksums.txt)"
          echo "$expected  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -version

      - name: Run actionlint
        run: /tmp/actionlint -color

  image:
    name: Image (linux/arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      CDB_IMAGE: ghcr.io/${{ github.repository_owner }}/cdb-kanban
      IMAGE: ghcr.io/${{ github.repository_owner }}/cdb-kanban:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Lint Dockerfile (hadolint)
        run: |
          set -euo pipefail
          version=2.15.1
          base="https://github.com/hadolint/hadolint/releases/download/v${version}"
          case "$(uname -m)" in
            aarch64 | arm64) asset=hadolint-linux-arm64 ;;
            x86_64) asset=hadolint-linux-x86_64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o /tmp/hadolint "$base/$asset"
          curl -fsSL -o /tmp/hadolint.sha256 "$base/checksums.sha256"
          expected="$(awk -v f="$asset" '{n=$2; sub(/^\*/, "", n); if (n == f) print $1}' \
            /tmp/hadolint.sha256)"
          echo "$expected  /tmp/hadolint" | sha256sum -c -
          chmod +x /tmp/hadolint
          /tmp/hadolint Dockerfile

      - name: Build image
        run: docker build --pull --tag "$IMAGE" .

      - name: Scan image (trivy)
        run: |
          set -euo pipefail
          version=0.76.2
          base="https://github.com/aquasecurity/trivy/releases/download/v${version}"
          case "$(uname -m)" in
            aarch64 | arm64) asset="trivy_${version}_Linux-ARM64.tar.gz" ;;
            x86_64) asset="trivy_${version}_Linux-64bit.tar.gz" ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL -o /tmp/trivy.tar.gz "$base/$asset"
          curl -fsSL -o /tmp/trivy.sha256 "$base/trivy_${version}_checksums.txt"
          expected="$(awk -v f="$asset" '$2 == f {print $1}' /tmp/trivy.sha256)"
          echo "$expected  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          /tmp/trivy image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 0 "$IMAGE"

      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "$IMAGE" "$CDB_IMAGE:latest"
          docker push "$IMAGE"
          docker push "$CDB_IMAGE:latest"
          docker logout ghcr.io
