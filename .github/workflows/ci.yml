name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: studydb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studydb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: studydb
      DB_USER: app_user
      DB_PASSWORD: ci-app-password
      DB_SSLMODE: disable
      APP_SECRET_KEY: ci-only-session-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r app/requirements.txt

      - name: Apply schema and create app_user
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d studydb -v ON_ERROR_STOP=1 \
            -f infra/setup/schema.sql
          psql -h 127.0.0.1 -U postgres -d studydb -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app_user LOGIN PASSWORD 'ci-app-password';
          GRANT CONNECT ON DATABASE studydb TO app_user;
          GRANT USAGE ON SCHEMA public TO app_user;
          GRANT SELECT, INSERT, UPDATE, DELETE ON users, tasks TO app_user;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_user;
          SQL
          is_super=$(psql -h 127.0.0.1 -U postgres -d studydb -tAc \
            "SELECT rolsuper FROM pg_roles WHERE rolname = 'app_user'")
          test "$is_super" = "f"

      - name: Syntax checks
        run: |
          set -euo pipefail
          python -m py_compile app/app.py .github/scripts/ci-smoke.py
          node --check app/app.js
          bash -n infra/ops/deploy.sh

      - name: Smoke test (Flask test client)
        run: python .github/scripts/ci-smoke.py
