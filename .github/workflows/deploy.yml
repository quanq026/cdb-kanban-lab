name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to cdb-vm
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, cdb-vm]
    timeout-minutes: 20

    env:
      DOMAIN: kanban.akaine.io.vn
      IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/cdb-kanban
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 1

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Pull with the runner user (member of the docker group, set up by
      # infra/setup/vm.sh). sudo then reuses the image from the same daemon, so
      # root never needs the runner's GHCR credentials.
      - name: Pull image as the runner user
        run: docker pull "$IMAGE_REPO:$IMAGE_TAG"

      - name: Deploy (compose up + health + rollback)
        run: |
          set -euo pipefail
          sudo env IMAGE_REPO="$IMAGE_REPO" IMAGE_TAG="$IMAGE_TAG" DOMAIN="$DOMAIN" \
            bash infra/ops/deploy.sh "$GITHUB_WORKSPACE"

      - name: Verify production
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 http://127.0.0.1:8000/api/health
          curl -fsS --max-time 20 -k --resolve "$DOMAIN:443:127.0.0.1" \
            "https://$DOMAIN/api/health"
          curl -fsS -o /dev/null -w 'login=%{http_code}\n' --max-time 20 \
            -k --resolve "$DOMAIN:443:127.0.0.1" \
            "https://$DOMAIN/login"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io || true
