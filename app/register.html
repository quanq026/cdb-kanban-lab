<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng ký · CDB Kanban</title>
<link rel="stylesheet" href="/app.css?v=20261110f">
</head>
<body class="auth-body">
<main class="auth">
  <form id="register-form" class="auth-card" novalidate>
    <div class="brand auth-brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">CDB Kanban</span>
    </div>
    <h1 class="auth-title">Tạo tài khoản</h1>

    <label class="field block">
      <span class="field-label">Email</span>
      <input id="register-email" type="email" inputmode="email" autocomplete="username" required placeholder="ten@example.com">
    </label>
    <label class="field block">
      <span class="field-label">Mật khẩu</span>
      <input id="register-password" type="password" autocomplete="new-password" minlength="8" required placeholder="Ít nhất 8 ký tự">
    </label>
    <label class="field block">
      <span class="field-label">Nhập lại mật khẩu</span>
      <input id="register-confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="Nhập lại mật khẩu">
    </label>

    <p id="register-error" class="auth-error" role="alert" aria-live="assertive" hidden></p>

    <button id="register-submit" class="btn primary block-btn" type="submit">Tạo tài khoản</button>
    <p class="auth-alt">Đã có tài khoản? <a href="/login">Đăng nhập</a></p>
  </form>
</main>
<script src="/app.js?v=20261110f" defer></script>
</body>
</html>
