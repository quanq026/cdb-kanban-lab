<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập · CDB Kanban</title>
<link rel="stylesheet" href="/app.css?v=20261110f">
</head>
<body class="auth-body">
<main class="auth">
  <form id="login-form" class="auth-card" novalidate>
    <div class="brand auth-brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">CDB Kanban</span>
    </div>
    <h1 class="auth-title">Đăng nhập</h1>

    <label class="field block">
      <span class="field-label">Email</span>
      <input id="login-email" type="email" inputmode="email" autocomplete="username" required placeholder="ten@example.com">
    </label>
    <label class="field block">
      <span class="field-label">Mật khẩu</span>
      <input id="login-password" type="password" autocomplete="current-password" required placeholder="••••••••">
    </label>

    <p id="login-error" class="auth-error" role="alert" aria-live="assertive" hidden></p>

    <button id="login-submit" class="btn primary block-btn" type="submit">Đăng nhập</button>
    <p class="auth-alt">Chưa có tài khoản? <a href="/register">Đăng ký</a></p>
  </form>
</main>
<script src="/app.js?v=20261110f" defer></script>
</body>
</html>
